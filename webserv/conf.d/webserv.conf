http {

    server {
        client_max_body_size 1000000;
        listen 127.0.0.1:8080;
        server_name webserv1.com localhost;
        
        root /home/rhanitra/GITHUB/servweb/webserv;
        index index.html index.php;
        
        error_page 404 /errors/404.html;
        error_page 500 /errors/500.html;

        location /bootstrap/ {
            root /home/rhanitra/GITHUB/servweb/webserv/servers;
            methods GET;
        }

        location / {
            root /home/rhanitra/GITHUB/servweb/webserv/clients/www1;
            index index.html;
            methods GET POST DELETE;
            autoindex off;
        }

        location /test {
            root /home/rhanitra/GITHUB/servweb/webserv/servers;
            index index.html;
            methods POST GET DELETE;
            autoindex on;
        }

        location /cgi_bin {
            root /home/rhanitra/GITHUB/servweb/webserv/clients/www1/cgi_bin;
            cgi_extension .php;
            cgi_path /usr/bin/php-cgi;
        }

        location /uploads {
            root /home/rhanitra/GITHUB/servweb/webserv/servers;
            index index.html;
            methods POST GET;
            autoindex off;
        }
    }

    server {
        client_max_body_size 1000000;
        listen 127.0.0.1:8081;
        server_name webserv2.com localhost;

        root /home/rhanitra/GITHUB/servweb/webserv;
        index index.html;

        error_page 404 /errors/404.html;
        error_page 500 /errors/500.html;

        location /bootstrap/ {
            root /home/rhanitra/GITHUB/servweb/webserv/servers;
            methods GET;
        }

        location / {
            root /home/rhanitra/GITHUB/servweb/webserv/clients/www2;
            index index.html;
            methods GET POST DELETE;
            autoindex off;
        }

        location /cgi_bin {
            root /home/rhanitra/GITHUB/servweb/webserv/clients/www2/cgi_bin;
            cgi_extension .php;
            cgi_path /usr/bin/php-cgi;
        }

        location /uploads {
            root /home/rhanitra/GITHUB/servweb/webserv/servers/server;
            methods POST GET;
            autoindex off;
        }

    }
}